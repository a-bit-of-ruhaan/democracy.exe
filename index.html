<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracy Simulator™</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-particles"></div>
    <div class="disclaimer">FICTIONAL PARODY — NOT A REAL VOTING SYSTEM</div>

    <header>
        <h1>DEMOCRACY SIMULATOR™</h1>
        <p class="subtitle">100% Fair and Honest Voting.</p>
    </header>

    <main id="app-container">
        <section id="parties-grid" class="parties-grid">
            <!-- Party cards will be injected here via JS -->
        </section>


    </main>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-content" class="modal-content glass-panel">
            <!-- Modal content injected via JS -->
        </div>
    </div>

    <!-- Captcha Modal Overlay -->
    <div id="captcha-overlay" class="modal-overlay hidden">
        <div class="modal-content glass-panel captcha-panel">
            <h3 class="modal-title">SECURITY CHECK</h3>
            <p class="modal-body">Select all tiles containing <strong>Empty Promises</strong> to proceed.</p>
            <div class="captcha-grid">
                <div class="captcha-box" onclick="this.classList.toggle('selected')"><i class="fa-solid fa-bridge captcha-icon"></i><br>Completed Bridge</div>
                <div class="captcha-box" onclick="this.classList.toggle('selected')"><i class="fa-solid fa-money-bill-wave captcha-icon"></i><br>₹15 Lakhs</div>
                <div class="captcha-box" onclick="this.classList.toggle('selected')"><i class="fa-solid fa-road captcha-icon"></i><br>Pothole-free Road</div>
                <div class="captcha-box" onclick="this.classList.toggle('selected')"><i class="fa-solid fa-user-graduate captcha-icon"></i><br>2 Crore Jobs</div>
            </div>
            <button class="btn primary-btn" style="margin-top: 1rem;" onclick="verifyCaptcha()">VERIFY I AM A CITIZEN</button>
        </div>
    </div>

    <!-- Final Outcome Container -->
    <div id="media-container" class="media-container hidden glass-panel">
        <h2 id="meme-text" class="meme-text"></h2>
        <img id="meme-image" src="" alt="Meme Placeholder" class="hidden">
        <button id="reset-btn" class="btn primary-btn">REBOOT DEMOCRACY</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Confetti Container -->
    <div id="confetti-container" class="confetti-container"></div>

    <script src="script.js"></script>
</body>

</html>
